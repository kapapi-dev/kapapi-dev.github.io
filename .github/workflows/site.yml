name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate product pages
        run: python build.py
      - name: Verify generated pages are committed
        run: git diff --exit-code
      - name: Validate metadata and links
        run: python scripts/check_site.py
